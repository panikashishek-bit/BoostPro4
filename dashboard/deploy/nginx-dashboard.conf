# Как пульт попадает в открытый интернет.
#
# На боксе один публичный порт — 80, и на нём nginx отдаёт статику штаба
# из Воркшопа 1. Приложение слушает только 127.0.0.1:3000 и снаружи не видно.
# Второй порт наружу не открываем: у бокса его нет.
#
# Поэтому nginx остаётся тем же веб-сервером статики, но два маршрута уводит
# в приложение: сам пульт и служебную статику Next, без которой пульт приедет
# без стилей и форма входа не отправится.
#
# Наружу выставлен ТОЛЬКО /dashboard. Витрина, /admin и /api остаются внутри
# бокса, как и были: сегодняшняя задача — пульт, а не публикация админки.
#
# __STATIC_ROOT__ подставляется при деплое из секрета DEPLOY_PATH.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __STATIC_ROOT__;
    index index.html;

    # Штаб из Воркшопа 1 — как было.
    location / {
        try_files $uri $uri/ =404;
    }

    # Пульт.
    location /dashboard {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Снаружи бокс отвечает по https, внутрь запрос приходит по http.
        # Без этого заголовка Next считал бы соединение незащищённым и кука
        # входа с флагом secure не доехала бы обратно — вход молча не сработал бы.
        proxy_set_header X-Forwarded-Proto https;
        # Форма входа — серверное действие, а Next сверяет у них Origin с адресом
        # сайта и чужие отвергает. За прокси он смотрит на этот заголовок; без него
        # сверка идёт с внутренним адресом, и вход отказывает без объяснений.
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Стили и скрипты страницы. Живут по /_next/ и нужны и пульту, и только ему:
    # без них страница открывается голым текстом.
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
