# Боевая связка на сервере: база + приложение + бот.
# Значения берутся из .env рядом — его пишет GitHub Actions из секретов репозитория,
# в git этот файл не попадает.
#
# restart: unless-stopped — это и есть «работает без моего компьютера»:
# контейнеры сами поднимаются после падения и после перезагрузки сервера.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proservice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: proservice
    volumes:
      - db-data:/var/lib/postgresql/data
    # Наружу порт не открываем: база доступна только внутри сети compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://proservice:${POSTGRES_PASSWORD}@db:5432/proservice
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_API_KEY: ${APP_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Настройки пульта. Своим файлом, а не переменными окружения: пульт читает
      # только dashboard/.env, чтобы папку можно было унести в другой проект целиком.
      #
      # Томом, а не копированием в образ: рабочий образ собирается из .next,
      # node_modules и public — файла настроек в нём нет и быть не должно,
      # секретам в слоях образа не место.
      #
      # ⚠️ Файл обязан существовать до старта: на месте отсутствующего docker
      # создаёт ПАПКУ, и пульт покажет «по этому пути папка, а не файл».
      # Создаёт его шаг «Настройки пульта» в deploy.yml.
      - ./dashboard/.env:/app/dashboard/.env:ro
      # Лог событий бота. Пульт его только читает (соединение открывается readOnly),
      # но том смонтирован на запись сознательно: в режиме WAL SQLite обязан создавать
      # рядом служебный -shm, и на файловой системе «только чтение» чтение падает.
      - ./data:/app/data
    # Только на локальный интерфейс: снаружи API не нужно, бот ходит по сети compose.
    # Порт 80 на сервере занят статикой штаба из Воркшопа 1 — её не трогаем.
    ports:
      - "127.0.0.1:3000:3000"

  bot:
    build:
      context: .
      dockerfile: bot_administrator/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      APP_API_KEY: ${APP_API_KEY}
      APP_API_URL: ${APP_API_URL}
      # Журнал обращений в Google-таблице. Ключ приходит переменной, а не файлом:
      # bind-mount на этом хосте Docker отвергает («invalid volume specification»)
      # и роняет вместе с ботом ещё и приложение. Переменная не зависит ни от путей,
      # ни от того, как хост понимает монтирование. В образ ключ не попадает.
      GOOGLE_SA_KEY: ${GOOGLE_SA_KEY}
      SHEET_ID: ${SHEET_ID}
      # Лог событий. Путь считается от корня проекта, поэтому значение здесь и в
      # dashboard/.env одинаковое — «data/events.db».
      EVENTS_DB_PATH: ${EVENTS_DB_PATH:-data/events.db}
      # ⚠️ Эта же цифра есть у пульта, и они обязаны совпадать. Бот пишет своё
      # фактическое значение в базу, пульт сверяется и скажет о расхождении.
      SESSION_TIMEOUT_MIN: ${SESSION_TIMEOUT_MIN:-30}
    depends_on:
      - app
    volumes:
      # История диалогов переживает передеплой: без тома клиент после обновления
      # оказывался бы посреди записи с ботом, который всё забыл.
      - bot-data:/srv/bot_administrator/data
      # Лог событий — ТОМ С ХОСТА, и это главная защита истории.
      #
      # Деплой делает docker compose up --build, то есть пересобирает контейнер
      # на каждый пуш. Всё, что бот записал внутрь контейнера, при этом пропадает.
      # Здесь же файл лежит на самом сервере (SERVER_PATH/data), переживает любые
      # пересборки, и его же читает приложение с пультом.
      - ./data:/srv/data

volumes:
  db-data:
  bot-data:
