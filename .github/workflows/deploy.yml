# ─────────────────────────────────────────────────────────────────────────────
# Авто-деплой: GitHub Actions → сервер по SSH. Запускается на каждый пуш в main.
#
# Две части:
#   1) штаб — статика из ./public в DEPLOY_PATH (как на Воркшопе 1, не меняли);
#   2) связка — база, приложение и бот в Docker Compose, работают 24/7.
#
# Секреты (Settings → Secrets and variables → Actions):
#   доступ:   SSH_HOST · SSH_USER · SSH_KEY · SSH_PORT · DEPLOY_PATH · SERVER_PATH
#   журнал:   SHEET_ID (id таблицы «Клиенты») · GOOGLE_SA_KEY (JSON служебного аккаунта целиком)
#   сервисы:  TELEGRAM_BOT_TOKEN · OPENROUTER_API_KEY · ASSEMBLYAI_API_KEY
#   свои:     APP_API_KEY · APP_API_URL · ADMIN_PASSWORD · POSTGRES_PASSWORD
#   пульт:    DASHBOARD_PASSWORD (необязателен; без него пульт получит admin)
#
# Секретов в репозитории нет: .env собирается на сервере во время деплоя.
# ─────────────────────────────────────────────────────────────────────────────
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код репозитория
        uses: actions/checkout@v4

      - name: Скопировать штаб из ./public на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "public/*"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Скопировать исходники приложения и бота
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "src,dashboard,prisma,public,faq,bot_administrator,package.json,package-lock.json,next.config.ts,tsconfig.json,postcss.config.mjs,Dockerfile,.dockerignore,docker-compose.prod.yml"
          target: ${{ secrets.SERVER_PATH }}
          overwrite: true
          rm: false

      - name: Собрать .env и поднять связку
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          envs: SERVER_PATH,DEPLOY_PATH,DASHBOARD_PASSWORD,SHEET_ID
          script: |
            set -e
            cd "$SERVER_PATH"

            # .env пишется здесь и остаётся только на сервере. Права 600:
            # файл содержит все ключи, читать его посторонним незачем.
            umask 077
            cat > .env <<ENVFILE
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            ASSEMBLYAI_API_KEY=${{ secrets.ASSEMBLYAI_API_KEY }}
            APP_API_KEY=${{ secrets.APP_API_KEY }}
            APP_API_URL=${{ secrets.APP_API_URL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            SHEET_ID=${{ secrets.SHEET_ID }}
            EVENTS_DB_PATH=data/events.db
            SESSION_TIMEOUT_MIN=30
            ENVFILE
            chmod 600 .env

            # Ключ служебного аккаунта для журнала обращений — в .env одной строкой.
            # Переносы строк убираем: в JSON они незначимы, а внутри приватного ключа
            # стоят экранированные последовательности, их tr не трогает.
            # Одинарные кавычки безопасны: в JSON их нет, а compose снимает их сам.
            cat > sa-key.json <<'KEYFILE'
            ${{ secrets.GOOGLE_SA_KEY }}
            KEYFILE

            # Проверяем ключ, но связку из-за него не роняем: без журнала бот работает,
            # а вот без бота салон остаётся без ответов. Плохой ключ — предупреждение
            # сейчас и падение job в самом конце, когда всё уже поднято.
            KEY_OK=1
            if [ ! -s sa-key.json ] || ! head -c 1 sa-key.json | grep -q "{"; then
              echo "ВНИМАНИЕ: секрет GOOGLE_SA_KEY пуст или не похож на JSON."
              echo "Журнал обращений писаться не будет."
              KEY_OK=0
            else
              echo "ключ служебного аккаунта получен ($(wc -c < sa-key.json) байт)"
              KEY_LINE=$(tr -d "\n" < sa-key.json)
              echo "GOOGLE_SA_KEY='$KEY_LINE'" >> .env
            fi
            rm -f sa-key.json

            # --- Настройки пульта ---
            # У пульта свой .env, отдельный от .env приложения: он читает только его.
            # Деплоем этот файл не едет (секреты в git не хранятся), поэтому создаём
            # его здесь — и только если его ещё нет.
            #
            # Не перезаписываем существующий сознательно: в него дописываются пути
            # к источникам данных, которые есть только на сервере. Переписывать файл
            # на каждый деплой значило бы молча стирать их.
            #
            # Файл обязан существовать ДО compose up: он смонтирован в контейнер томом,
            # а docker на месте отсутствующего файла создаёт ПАПКУ, и пульт потом
            # не может прочитать свои настройки.
            mkdir -p dashboard

            # Папка под лог событий. Создаём ЗДЕСЬ, до compose up: у отсутствующего
            # источника тома docker делает каталог сам, но от имени root, и бот
            # внутри контейнера потом не может в него писать.
            mkdir -p data

            # Дописывает настройку, если её ещё нет. Существующее значение не трогаем:
            # в файле на сервере лежит то, что владелец правил руками.
            add_setting() {
              # Значение уже стоит — не трогаем: в файле на сервере лежит то,
              # что владелец правил руками.
              if grep -q "^$2=." "$1" 2>/dev/null; then
                echo "  $2 уже заполнен в $1"
                return
              fi
              # Ключа нет вовсе — дописываем (пустым значением тоже: пусть будет виден).
              if ! grep -q "^$2=" "$1" 2>/dev/null; then
                { printf '%s=' "$2"; printf '%s' "$3"; echo; } >> "$1"
                echo "  $2 добавлен в $1"
                return
              fi
              # Ключ есть, но пустой. Заполняем, только если есть чем: иначе каждый
              # деплой переписывал бы пустую строку пустой строкой.
              if [ -n "$3" ]; then
                sed -i "/^$2=/d" "$1"
                { printf '%s=' "$2"; printf '%s' "$3"; echo; } >> "$1"
                echo "  $2 заполнен в $1"
              else
                echo "  $2 пуст в $1 и заполнять нечем"
              fi
            }

            if [ ! -f dashboard/.env ]; then
              # Секрет не заведён — ставим admin. Пустая переменная означала бы,
              # что вход закрыт для всех, включая хозяина: пульт молчал бы на любой пароль.
              : "${DASHBOARD_PASSWORD:=admin}"
              # Пароль пишем printf-ом из переменной, а НЕ строкой внутри heredoc:
              # тело heredoc с неэкранированным словом оболочка разбирает, и пароль
              # с $ молча обрезался бы, а с обратными кавычками — выполнился командой.
              { printf 'DASHBOARD_PASSWORD='; printf '%s' "$DASHBOARD_PASSWORD"; echo; } > dashboard/.env
              chmod 600 dashboard/.env
              echo "dashboard/.env создан"
            else
              echo "dashboard/.env уже есть — пароль не трогаю"
            fi

            # Остальные настройки дописываем в любом случае. Файл, созданный прошлым
            # деплоем, новых переменных не знает: без этого пульт не нашёл бы базу
            # событий, и строка «лог событий» осталась бы серой без всякой причины.
            add_setting dashboard/.env EVENTS_DB_PATH data/events.db
            add_setting dashboard/.env SESSION_TIMEOUT_MIN 30
            # Пульту — свой id таблицы и свой ключ, отдельно от бота: у каждого
            # сотрудника свой файл настроек, и в чужой пульт не заглядывает.
            # Ключ тот же самый, что у бота, и приезжает он тем же секретом.
            add_setting dashboard/.env CLIENTS_SHEET_ID "$SHEET_ID"
            add_setting dashboard/.env CLIENTS_SA_KEY_PATH ""
            if [ "$KEY_OK" = "1" ]; then
              add_setting dashboard/.env CLIENTS_SA_KEY "$KEY_LINE"
            else
              add_setting dashboard/.env CLIENTS_SA_KEY ""
            fi
            add_setting dashboard/.env TRANSCRIPTS_DIR ""
            chmod 600 dashboard/.env

            echo "=== сборка и запуск ==="
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "=== ждём, пока приложение ответит ==="
            for i in $(seq 1 60); do
              if docker compose -f docker-compose.prod.yml exec -T app \
                   node -e "fetch('http://localhost:3000/api/services',{headers:{'x-api-key':process.env.APP_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
                echo "приложение отвечает (через $i с)"; break
              fi
              [ "$i" = "60" ] && { echo "приложение не поднялось"; docker compose -f docker-compose.prod.yml logs --tail=50 app; exit 1; }
              sleep 1
            done

            # Наливаем демо-данные только в пустую базу: seed чистит таблицы,
            # и на живой базе он стёр бы реальные записи клиентов.
            COUNT=$(docker compose -f docker-compose.prod.yml exec -T db \
              psql -U proservice -d proservice -tAc 'SELECT COUNT(*) FROM "Service"' 2>/dev/null || echo 0)
            if [ "$COUNT" = "0" ]; then
              echo "=== база пустая, наливаю seed ==="
              docker compose -f docker-compose.prod.yml exec -T app npx tsx prisma/seed.ts
            else
              echo "=== в базе уже $COUNT услуг, seed пропускаю ==="
            fi

            echo "=== состояние ==="
            docker compose -f docker-compose.prod.yml ps
            echo "=== последние строки лога бота ==="
            docker compose -f docker-compose.prod.yml logs --tail=15 bot

            # --- Пульт наружу ---
            # Приложение слушает только 127.0.0.1:3000. Публичный порт один — 80,
            # на нём nginx отдаёт статику штаба. Учим его вдобавок отдавать /dashboard.
            #
            # Шаг не роняет деплой ни при какой неудаче: связка уже работает,
            # и остаться без сайта из-за правки веб-сервера — плохой размен.
            if [ -z "$DEPLOY_PATH" ]; then
              echo "ВНИМАНИЕ: DEPLOY_PATH пуст, корень статики неизвестен — nginx не трогаю."
            elif ! command -v nginx >/dev/null 2>&1; then
              echo "ВНИМАНИЕ: nginx на боксе нет — пульт снаружи не откроется."
            elif ! sudo -n true 2>/dev/null; then
              echo "ВНИМАНИЕ: нет sudo без пароля — конфиг nginx не поставить автоматически."
              echo "Поставь вручную: dashboard/deploy/nginx-dashboard.conf → /etc/nginx/sites-available/default"
            else
              SITE=/etc/nginx/sites-available/default
              sed "s|__STATIC_ROOT__|$DEPLOY_PATH|" dashboard/deploy/nginx-dashboard.conf > /tmp/dashboard-site.conf

              if sudo cmp -s /tmp/dashboard-site.conf "$SITE"; then
                echo "конфиг nginx уже актуален"
              else
                # Резервная копия — до записи. Битый конфиг откатываем сразу:
                # публичный адрес важнее пульта.
                sudo cp -n "$SITE" "$SITE.before-dashboard" 2>/dev/null || true
                sudo cp /tmp/dashboard-site.conf "$SITE"
                if sudo nginx -t 2>/dev/null; then
                  sudo systemctl reload nginx && echo "nginx обновлён: /dashboard смотрит наружу"
                else
                  echo "ВНИМАНИЕ: nginx отверг конфиг — откатываю, сайт остаётся как был."
                  sudo cp "$SITE.before-dashboard" "$SITE" && sudo systemctl reload nginx || true
                fi
              fi
              rm -f /tmp/dashboard-site.conf
            fi

            # Связка поднята — теперь можно и упасть, чтобы проблема с ключом не потерялась.
            [ "$KEY_OK" = "1" ] || { echo "деплой прошёл, но журнал обращений не настроен"; exit 1; }
