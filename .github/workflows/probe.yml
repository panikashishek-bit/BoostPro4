# Временный workflow: осмотреть сервер перед выкаткой.
# Удаляется тем же коммитом, которым добавляется настоящий деплой.
name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Что есть на сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=== КТО И ГДЕ ==="
            whoami; hostname; cat /etc/os-release | head -2; pwd
            echo "=== SUDO ==="
            sudo -n true 2>/dev/null && echo "sudo без пароля: ДА" || echo "sudo без пароля: нет"
            echo "=== ИНСТРУМЕНТЫ ==="
            for c in node npm docker "docker compose" systemctl pm2 nginx psql git curl; do
              printf "  %-16s " "$c"
              $c --version >/dev/null 2>&1 && $c --version 2>&1 | head -1 || echo "нет"
            done
            echo "=== SYSTEMD ДЛЯ ПОЛЬЗОВАТЕЛЯ ==="
            systemctl --user status >/dev/null 2>&1 && echo "user systemd: ДА" || echo "user systemd: нет"
            loginctl show-user "$(whoami)" 2>/dev/null | grep -i linger || echo "  linger: неизвестно"
            echo "=== ЧТО УЖЕ ЛЕЖИТ ==="
            ls -la "$HOME" | head -20
            echo "--- DEPLOY_PATH ---"; ls -la "${{ secrets.DEPLOY_PATH }}" 2>/dev/null | head -10
            echo "=== ПОРТЫ, КОТОРЫЕ СЛУШАЮТ ==="
            (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | head -15
            echo "=== ИСХОДЯЩАЯ СВЯЗЬ (нужна боту) ==="
            for u in https://api.telegram.org https://openrouter.ai https://api.assemblyai.com; do
              printf "  %-32s " "$u"
              curl -s -o /dev/null -m 10 -w "HTTP %{http_code}\n" "$u" || echo "НЕДОСТУПЕН"
            done
            echo "=== РЕСУРСЫ ==="
            free -m | head -2; df -h "$HOME" | tail -1; nproc
